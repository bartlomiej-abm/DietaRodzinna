<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dieta rodzinna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#141B2E;
  --steel:#2E4B6B;
  --slate:#7C8BA3;
  --mist:#EDF1F6;
  --paper:#FBFCFE;
  --line:#D6DEE9;
  --oliwia:#7E5AA6;
  --bartek:#2F6FB0;
  --syn:#2E8B8B;
  --ok:#2F8B6C;
  --warn:#C08A2F;
  --over:#C0492F;
  --shadow:0 2px 12px rgba(20,27,46,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--mist);color:var(--navy);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

.topbar{background:var(--navy);color:var(--mist);padding:14px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(20,27,46,.25)}
.brand{font-weight:800;font-size:19px;letter-spacing:.3px}
.brand span{color:var(--slate);font-weight:500}
.sync-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid transparent}
.sync-badge.local{background:rgba(255,255,255,.08);color:var(--slate)}
.sync-badge.syncing{background:#3a3f2e;color:#d8c98a}
.sync-badge.synced{background:#22402f;color:#7fce9f}
.sync-badge.error{background:#40262e;color:#e09ca0}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:transparent;border:none;color:var(--slate);padding:8px 15px;border-radius:8px;font-size:14px;font-weight:600;transition:.15s}
.tab:hover{background:rgba(255,255,255,.06);color:var(--mist)}
.tab.active{background:var(--steel);color:#fff}

.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 80px}
.view{display:none;animation:fade .25s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2.section-h{font-size:24px;font-weight:700;margin-bottom:4px}
.section-sub{color:var(--slate);font-size:14px;margin-bottom:22px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g3,.g2{grid-template-columns:1fr}}

.btn{background:var(--steel);color:#fff;border:none;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:600;transition:.15s}
.btn:hover{background:var(--navy)}
.btn.ghost{background:transparent;color:var(--steel);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--mist)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* week + day pickers */
.week-tabs{display:flex;gap:6px;margin-bottom:14px}
.week-tab{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 18px;font-size:14px;font-weight:700;color:var(--steel)}
.week-tab.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.day-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.day-btn{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--steel);text-align:center;min-width:44px}
.day-btn small{display:block;font-size:10px;color:var(--slate);font-weight:500}
.day-btn.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.day-btn.active small{color:#cdd8e6}

/* tracking */
.person-track{margin-bottom:0}
.person-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:4px}
.dot{width:10px;height:10px;border-radius:50%}
.dot.d-oliwia{background:var(--oliwia)}.dot.d-bartek{background:var(--bartek)}.dot.d-syn{background:var(--syn)}
.train-tag{font-size:11px;color:var(--slate);font-weight:500;margin-left:auto}
.bar-wrap{margin:9px 0}
.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.bar-label b{font-weight:600}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .35s ease}
.bar-fill.ok{background:var(--ok)}.bar-fill.warn{background:var(--warn)}.bar-fill.over{background:var(--over)}
.meal-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px}
.meal-item:last-child{border-bottom:none}
.meal-item .chk{width:19px;height:19px;accent-color:var(--steel);cursor:pointer;flex-shrink:0;margin-top:2px}
.meal-item .mbody{flex:1}
.meal-item .mname{font-weight:600}
.meal-item .mslot{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);font-weight:700}
.meal-item .mportion{font-size:12px;color:var(--slate);margin-top:2px}
.meal-item .mkcal{color:var(--slate);font-size:12px;white-space:nowrap;font-weight:600}
.meal-item.done .mname{text-decoration:line-through;color:var(--slate)}
.batch-flag{display:inline-block;font-size:10px;font-weight:700;background:#e7eef6;color:var(--steel);border:1px solid #cfddec;padding:1px 7px;border-radius:20px;margin-left:6px;text-transform:uppercase;letter-spacing:.3px}
.train-switch{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 12px}
.train-opt{background:var(--mist);border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--steel)}
.train-opt.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.moved-tag{font-size:11px;font-weight:600;color:var(--warn);background:#f6efe0;border:1px solid #ecdcc0;padding:2px 8px;border-radius:20px;margin-left:auto}
.meal-item.snack{background:#f0eef6;border-radius:8px;padding-left:8px;padding-right:8px;border-bottom:1px dashed var(--line)}
.meal-item.snack .mslot{color:var(--oliwia)}
.meal-item.snack .mkcal{color:var(--oliwia);font-style:italic}

/* prep banner */
.prep-banner{background:#e7eef6;border-left:3px solid var(--steel);padding:10px 15px;border-radius:0 9px 9px 0;font-size:13px;color:var(--steel);margin-bottom:18px;font-weight:500}
.prep-banner b{font-weight:700}

/* recipes */
.recipe{border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px;background:var(--paper)}
.recipe-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:2px}
.recipe-id{font-size:11px;font-weight:700;color:var(--slate);background:var(--mist);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.recipe-use{font-size:12px;color:var(--slate);margin-bottom:10px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter-chip{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--steel);display:flex;align-items:center;gap:6px}
.filter-chip:hover{background:var(--mist)}
.filter-chip.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.fc-count{font-size:11px;font-weight:700;opacity:.7}
.filter-chip.active .fc-count{opacity:.85}
.recipe-sec{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);font-weight:700;margin:8px 0 3px}
.recipe-txt{font-size:13.5px;color:var(--navy);line-height:1.55}

/* batch */
.batch-card{border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px;background:var(--paper);border-top:3px solid var(--syn)}
.batch-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.batch-days{font-size:12px;font-weight:700;color:var(--syn);background:#e2eef0;border:1px solid #c7e0e2;padding:2px 9px;border-radius:20px}

/* shopping */
.shop-cat{font-weight:700;color:var(--steel);margin:16px 0 6px;font-size:15px}
.shop-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.shop-item input{width:18px;height:18px;accent-color:var(--steel)}
.shop-item.done .shop-name{text-decoration:line-through;color:var(--slate)}
.shop-name{flex:1}
.shop-q{font-weight:700;color:var(--steel);font-size:13px}
.shopday-picker{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.shopday-btn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:13px;font-weight:700;color:var(--steel);width:42px;text-align:center;line-height:1.1}
.shopday-btn small{display:block;font-size:9px;color:var(--slate);font-weight:500;text-transform:uppercase}
.shopday-btn.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.shopday-btn.active small{color:#cdd8e6}
.shop-sel-label{font-weight:700;font-size:15px;margin-bottom:12px;color:var(--navy)}
.shop-note{background:#f6efe0;border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 9px 9px 0;font-size:13px;color:#7a5b1f;margin-bottom:14px}
.shop-note div{margin:3px 0}
.batch-buy{border:1px solid var(--line);border-left:3px solid var(--syn);border-radius:8px;padding:12px 14px;margin:8px 0;background:#f5fafa}
.batch-buy-h{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.batch-buy-days{font-size:11px;font-weight:700;color:var(--syn);background:#e2eef0;border:1px solid #c7e0e2;padding:1px 8px;border-radius:20px}
.batch-buy-warn{font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.3px;margin:5px 0}
.batch-buy-ingr{font-size:13px;color:var(--navy);line-height:1.5}

.note{background:#e7eef6;border-left:3px solid var(--steel);padding:12px 16px;border-radius:0 9px 9px 0;font-size:13px;color:var(--steel);margin:16px 0}
.empty{text-align:center;color:var(--slate);padding:50px 20px;font-size:15px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3);transition:.3s;z-index:200;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* klikalne danie */
.mname.mclick{cursor:pointer;transition:color .12s}
.mname.mclick:hover{color:var(--steel)}
.recipe-arrow{color:var(--slate);font-weight:700;font-size:16px;opacity:.6}
.mname.mclick:hover .recipe-arrow{opacity:1;color:var(--steel)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,27,46,.55);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:300;padding:40px 16px;overflow-y:auto}
.modal-overlay.open{display:flex;animation:fade .2s}
.modal-box{background:var(--paper);border-radius:16px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(20,27,46,.4);position:relative;margin:auto}
.modal-close{position:absolute;top:14px;right:16px;background:var(--mist);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:20px;line-height:1;color:var(--slate);font-weight:600}
.modal-close:hover{background:var(--line)}
.modal-title{font-size:20px;font-weight:700;padding-right:40px;line-height:1.25}
.modal-sub{display:block;font-size:12px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.modal-body{margin-top:16px}
.modal-sec{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);font-weight:700;margin:16px 0 5px}
.modal-txt{font-size:14px;color:var(--navy);line-height:1.6}
.modal-portions{background:var(--mist);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.9}
.modal-portions .dot{display:inline-block;vertical-align:middle;margin-right:2px}
.modal-kcal{font-size:12px;color:var(--slate);margin-top:6px;text-align:right}
.modal-note{background:#eef0f4;border-left:3px solid var(--slate);padding:11px 14px;border-radius:0 9px 9px 0;font-size:13px;color:var(--steel);margin-top:14px}
.modal-sos{background:#f5fafa;border:1px solid #d7e8e8;border-radius:9px;padding:10px 13px;margin:7px 0;font-size:13.5px}
.modal-sos b{color:var(--syn)}

.macro-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.macro-row:last-child{border-bottom:none}
.macro-row label{color:var(--steel);font-weight:500}
.macro-row input{width:90px;text-align:right;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:14px;font-weight:600;background:#fff;color:var(--navy)}
.unit{color:var(--slate);font-size:12px;width:40px;display:inline-block;text-align:left;margin-left:6px}
.profile-card{border-top:4px solid var(--line)}
.profile-card.p-oliwia{border-top-color:var(--oliwia)}
.profile-card.p-bartek{border-top-color:var(--bartek)}
.profile-card.p-syn{border-top-color:var(--syn)}
.profile-name{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.profile-goal{font-size:12.5px;color:var(--slate);margin-bottom:14px}

@media print{
  .topbar,.btn-row,.week-tabs,.day-picker{display:none!important}
  .view{display:none!important}.view.active{display:block!important}
  body{background:#fff}.card,.recipe,.batch-card{box-shadow:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Dieta<span> rodzinna</span></div>
  <span class="sync-badge local" id="syncBadge">lokalnie</span>
  <nav class="tabs">
    <button class="tab active" data-view="dzis">Dziś</button>
    <button class="tab" data-view="plan">Plan 14 dni</button>
    <button class="tab" data-view="przepisy">Przepisy</button>
    <button class="tab" data-view="batch">Batch cooking</button>
    <button class="tab" data-view="zakupy">Zakupy</button>
    <button class="tab" data-view="profile">Profile</button>
  </nav>
</div>
<div class="wrap">
  <section id="dzis" class="view active"></section>
  <section id="plan" class="view"></section>
  <section id="przepisy" class="view"></section>
  <section id="batch" class="view"></section>
  <section id="zakupy" class="view"></section>
  <section id="profile" class="view"></section>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ============ STAŁE ============
const PEOPLE=[
  {id:'oliwia',name:'Oliwia',color:'oliwia',goal:'spokojna redukcja przy bieganiu'},
  {id:'bartek',name:'Bartek',color:'bartek',goal:'wzrost masy i regeneracja'},
  {id:'syn',name:'Syn (26 mies.)',color:'syn',goal:'wzrost i rozwój, bez odchudzania'}
];
const SLOT_NAMES=['Śniadanie','Posiłek 2','Obiad','Kolacja'];

// typy treningu w przelaczniku
const TRAIN_OPTS=['bieg','long run','siłownia/CrossFit','odpoczynek'];
// ktore treningi maja sens z przekaska przedtreningowa
const TRAIN_WITH_SNACK=['bieg','long run','siłownia/CrossFit'];
// stala podpowiedz przekaski (0 kcal - paliwo juz wliczone w posilek 2)
const PRE_SNACK={name:'Przekąska przedtreningowa',hint:'banan + wafle ryżowe + miód',kcal:0};

// ============ BIBLIOTEKA PLANÓW ============

function freshState(){

// normalizacja wczytanego stanu (migracje pol)
function normalize(s){
  if(!s||!s.schema||!s.library||!Array.isArray(s.library)){
    const fresh=freshState();
    if(s&&s.targets)fresh.targets=s.targets;
    fresh._migrated=true;return fresh;
  }
  if(!s.library.find(p=>p.id==='plan1'))s.library.unshift(structuredClone(PLAN_LIBRARY[0]));
  if(!s.shopChecked)s.shopChecked={};
  if(!s.trainOverride)s.trainOverride={};
  if(!s.snackLog)s.snackLog={};
  return s;
}

function loadLocal(){
  let raw;try{raw=localStorage.getItem(KEY);}catch(e){return freshState();}
  if(!raw)return freshState();
  let s;try{s=JSON.parse(raw);}catch(e){return freshState();}
  return normalize(s);
}

let saveTimer=null;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(sbClient){
    // debounce, zeby nie wysylac przy kazdym klikniecu
    clearTimeout(saveTimer);
    saveTimer=setTimeout(saveCloud,600);
  }
}
async function saveCloud(){
  if(!sbClient)return;
  try{
    setSync('syncing');
    const payload=JSON.parse(JSON.stringify(state));
    delete payload._migrated;
    const {error}=await sbClient.from('dieta_state')
      .upsert({id:SHARED_ID,data:payload,updated_at:new Date().toISOString()});
    if(error)throw error;
    setSync('synced');
  }catch(e){console.error('Sync error:',e);setSync('error');}
}

function subscribeCloud(){
  if(!sbClient)return;
  sbClient.channel('dieta_sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'dieta_state',filter:'id=eq.'+SHARED_ID},
      payload=>{
        if(payload.new&&payload.new.data){
          state=normalize(payload.new.data);
          render();
          setSync('synced');
          toast('Zaktualizowano z drugiego urządzenia');
        }
      }).subscribe();

// ---- TRENINGI (przekładanie) ----
// domyslny trening z planu dla osoby danego dnia
function planTrain(personId,gd){
  const di=dayInfo(gd);if(!di)return'odpoczynek';
  return personId==='oliwia'?di.trO : personId==='bartek'?di.trB : 'odpoczynek';
}
// aktualny trening (uwzglednia przelozenie)
function trainFor(personId,gd){
  const ov=state.trainOverride[state.activePlan];
  if(ov&&ov[gd]&&ov[gd][personId]!==undefined)return ov[gd][personId];
  return planTrain(personId,gd);
}
function setTrain(personId,gd,val){
  const pid=state.activePlan;
  if(!state.trainOverride[pid])state.trainOverride[pid]={};
  if(!state.trainOverride[pid][gd])state.trainOverride[pid][gd]={};
  // jesli wrocil do domyslnego z planu, usun override (czysto)
  if(val===planTrain(personId,gd))delete state.trainOverride[pid][gd][personId];
  else state.trainOverride[pid][gd][personId]=val;
  save();renderDzis();
}
// normalizacja treningu do porownan (Excel ma warianty typu "easy run","tempo/interwały")
function trainHasSnack(t){
  if(!t)return false;
  const s=t.toLowerCase();
  if(s.includes('odpocz'))return false;
  return true; // kazdy trening (bieg/long/silownia/tempo/easy) dostaje przekaske
}
function toggleSnack(personId,gd){
  const pid=state.activePlan;
  if(!state.snackLog[pid])state.snackLog[pid]={};
  if(!state.snackLog[pid][gd])state.snackLog[pid][gd]={};
  if(state.snackLog[pid][gd][personId])delete state.snackLog[pid][gd][personId];
  else state.snackLog[pid][gd][personId]=true;
  save();renderDzis();
}

// ---- PRZEPIS W POP-UPIE ----
function normName(s){return (s||'').toLowerCase().replace(/[^a-ząćęłńóśźż0-9 ]/g,'').trim();}
// znajdz przepis dla dania (konserwatywnie - bez ryzykownych trafien)
function findRecipe(danie){
  const recs=curPlan().recipes;
  const dn=normName(danie);
  for(const r of recs)if(normName(r.name)===dn)return r;         // dokladne
  for(const r of recs){const rn=normName(r.name);if(dn.length>=5&&(dn.includes(rn)||rn.includes(dn)))return r;} // zawiera
  if(dn.includes('wrap'))return recs.find(r=>/wrap/i.test(r.name))||null;
  return null;
}
// znajdz sos powiazany z daniem (dania z tortilla/quesadilla/wrap)
function findSos(danie){
  const dn=normName(danie);
  if(!/tortilla|quesadilla|wrap|pizza/.test(dn))return null;
  // sosy to R16-R18
  return curPlan().recipes.filter(r=>/sos/i.test(r.name));
}

    ${weekTabs}<div class="day-picker">${dayBtns}</div>${prep}
    <div class="grid g3">${people}</div>`;
}
function bar(label,val,target,unit){
  const pct=target&&val!=null?Math.min(100,Math.round(val/target*100)):0;
  const cls=pct<85?'ok':pct<=105?'warn':'over';
  return `<div class="bar-wrap"><div class="bar-label"><span>${label}</span><b>${val} / ${target} ${unit}</b></div>
    <div class="bar"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div></div>`;
}
function setWeek(w){state.activeWeek=w;state.activeDay=1;save();renderDzis();}
function setDay(d){state.activeDay=d;save();renderDzis();}
function toggleMeal(person,day,slot){
  const pid=state.activePlan;
  if(!state.log[pid])state.log[pid]={};
  if(!state.log[pid][day])state.log[pid][day]={};
  if(!state.log[pid][day][person])state.log[pid][day][person]={};
  const key=day+'_'+slot;
  if(state.log[pid][day][person][key])delete state.log[pid][day][person][key];
  else state.log[pid][day][person][key]=true;
  save();renderDzis();
}

// kategoria przepisu na podstawie pola "use"
function recipeCat(use){
  const u=(use||'').toLowerCase();
  if(u.includes('śniad'))return 'sniadanie';
  if(u.includes('obiad'))return 'obiad';
  if(u.includes('kolacj'))return 'kolacja';
  if(u.includes('sos'))return 'sos';
  if(u.includes('posiłek 2')||u.includes('paliwo')||u.includes('long run'))return 'posilek2';
  return 'inne';
}
const RECIPE_FILTERS=[
  {id:'all',label:'Wszystkie'},
  {id:'sniadanie',label:'Śniadania'},
  {id:'posilek2',label:'Posiłek 2'},
  {id:'obiad',label:'Obiady'},
  {id:'kolacja',label:'Kolacje'},
  {id:'sos',label:'Sosy'}
];
let recipeFilter='all';

function renderPrzepisy(){
  const el=document.getElementById('przepisy');
  const all=curPlan().recipes;
  // policz ile w kazdej kategorii (do etykiet i chowania pustych filtrow)
  const counts={};all.forEach(x=>{const c=recipeCat(x.use);counts[c]=(counts[c]||0)+1;});
  const filtered=recipeFilter==='all'?all:all.filter(x=>recipeCat(x.use)===recipeFilter);

  const chips=RECIPE_FILTERS.filter(f=>f.id==='all'||counts[f.id]).map(f=>{
    const n=f.id==='all'?all.length:counts[f.id];
    return `<button class="filter-chip ${recipeFilter===f.id?'active':''}" onclick="setRecipeFilter('${f.id}')">${f.label} <span class="fc-count">${n}</span></button>`;
  }).join('');

  const r=filtered.map(x=>`<div class="recipe">
    <div class="recipe-h"><span class="recipe-id">${x.id}</span>${x.name}</div>
    <div class="recipe-use">${x.use}</div>
    <div class="recipe-sec">Składniki</div><div class="recipe-txt">${x.ingr}</div>
    <div class="recipe-sec">Przygotowanie</div><div class="recipe-txt">${x.prep}</div></div>`).join('');

  el.innerHTML=`<h2 class="section-h">Przepisy</h2>
    <div class="section-sub">Pełne bazy dań z sosami. Dokładne porcje osobowe są w zakładce Plan 14 dni.</div>
    <div class="filter-bar">${chips}</div>
    ${r||'<div class="empty">Brak przepisów w tej kategorii.</div>'}`;

function setRecipeFilter(f){recipeFilter=f;renderPrzepisy();}

// ---- ZAKUPY ----
// ---- ZAKUPY PER DZIEŃ ----
// parser skladnika z tekstu: "100 g chleba" -> {name:'chleb', qty:100, unit:'g'}
// normalizacja dopelniacza -> mianownik dla grupowania
const INGR_NORM={
  'płatków':'płatki','banan':'banan','banana':'banan','jajko':'jajko','jajka':'jajka',
  'mleka':'mleko','jogurtu':'jogurt','masła orzechowego':'masło orzechowe','chleba':'chleb',
  'pieczywa':'pieczywo','szynki':'szynka','sera':'ser żółty','tuńczyka':'tuńczyk',
  'kurczaka':'kurczak','indyka':'indyk','łososia':'łosoś','mozzarelli':'mozzarella',
  'twarogu':'twaróg','miodu':'miód','oliwy':'oliwa','sosu':'sos','warzyw':'warzywa',
  'warzywa':'warzywa','pomidor':'pomidor','bułki':'bułka','hummusu':'hummus',
  'ryżu':'ryż','makaronu':'makaron','ziemniaków':'ziemniaki','wołowiny':'wołowina',
  'mięsa':'mięso mielone','serka':'serek','tortilla':'tortilla','tortille':'tortilla',
  'tortilli':'tortilla','wafle':'wafle ryżowe','wafli':'wafle ryżowe','mango':'mango',
  'owoce':'owoc','owoc':'owoc','banan':'banan','fasoli':'fasola','passata':'passata',
  'kukurydza':'kukurydza','szpinak':'szpinak','papryka':'papryka'
};
function normIngr(raw){
  const w=raw.trim().toLowerCase();
  if(INGR_NORM[w])return INGR_NORM[w];
  // sprobuj usunac koncowke dopelniacza pojedynczych slow
  return raw.trim();
}
function parseIngr(part){
  let p=part.trim();
  if(!p)return null;
  // odetnij ogony typu "+ 30-45 g węgli/h biegu", "i warzywa", "z cienką..."
  p=p.replace(/\s*\+.*/,'').replace(/\s+i\s+.*/,'').replace(/\s+z\s+.*/,'').trim();
  // "100 g chleba" / "100 ml mleka"
  let m=p.match(/^(\d+)\s*(g|ml)\s+(.+)$/i);
  if(m)return {name:normIngr(m[3]),qty:+m[1],unit:m[2].toLowerCase()};
  // "1 banan" / "2 jajka" / "3 wafle" / "1 tortilla"
  m=p.match(/^(\d+)\s+(.+)$/);
  if(m)return {name:normIngr(m[2]),qty:+m[1],unit:'szt'};
  // "½ banana", "½ tortilli" -> traktuj jako 0.5 szt
  m=p.match(/^[½]\s+(.+)$/);
  if(m)return {name:normIngr(m[1]),qty:0.5,unit:'szt'};
  // sama nazwa: "warzywa", "pomidor", "banan"
  if(p.length>1 && !/^\d/.test(p))return {name:normIngr(p),unit:'wg potrzeb'};
  return null;
}
// ktory batch obejmuje obiad danego dnia + ktory dzien jest "dniem zakupu"
function batchInfoForDay(gd){
  const meals=mealsForDay(gd);
  const obiad=meals.find(m=>m.slot===3);
  if(!obiad)return null;
  const bm=(obiad.uwagi||'').match(/B(\d)/i);
  // znajdz pierwszy dzien tego dania obiadowego (dzien zakupu batcha)
  const sameName=curPlan().meals.filter(m=>m.slot===3 && m.name===obiad.name);
  const firstDay=Math.min(...sameName.map(m=>m.day));
  const lastDay=Math.max(...sameName.map(m=>m.day));
  const batch=curPlan().batches.find(b=>bm && b.id==='B'+bm[1]) ||
              curPlan().batches.find(b=>b.name.toLowerCase().includes(obiad.name.toLowerCase().split(' ')[0]));
  return {obiad,batch,firstDay,lastDay,isFirstDay:gd===firstDay};
}
// zbierz skladniki sniadania/pos2/kolacji dla dnia (surowe, zsumowane, bez osob)
function daySnbcIngredients(gd){
  const meals=mealsForDay(gd).filter(m=>m.slot!==3); // bez obiadu
  const totals={}; // name -> {qty, unit}
  meals.forEach(m=>{
    // bierzemy wersje Bartka jako "pelna" referencje surowych skladnikow dnia
    // (chodzi o liste produktow, nie o dokladny gram per osoba)
    (m.bartek||'').split(',').forEach(part=>{
      const ing=parseIngr(part);
      if(!ing)return;
      const key=ing.name;
      if(!totals[key])totals[key]={qty:0,unit:ing.unit,hasNum:false};
      if(ing.qty!=null){totals[key].qty+=ing.qty;totals[key].hasNum=true;totals[key].unit=ing.unit;}
    });
  });
  return totals;
}

function renderZakupy(){
  const el=document.getElementById('zakupy');
  if(!state.shopMode)state.shopMode='tydzien';
  const modeTabs=`<div class="week-tabs">
    <button class="week-tab ${state.shopMode==='tydzien'?'active':''}" onclick="setShopMode('tydzien')">Cały tydzień</button>
    <button class="week-tab ${state.shopMode==='dzien'?'active':''}" onclick="setShopMode('dzien')">Wg dni</button></div>`;

  if(state.shopMode==='dzien'){el.innerHTML=`<h2 class="section-h">Lista zakupów</h2>
    <div class="section-sub">Zakupy na wybrany dzień lub zakres. Obiady liczone raz — w dniu gotowania batcha.</div>
    ${modeTabs}${renderShopDays()}`;return;}

  // --- TRYB TYGODNIOWY (jak dotad) ---
  const shop=curPlan().shop;
  const wk=state.activeWeek===2?shop.w2:shop.w1;
  const cats={};wk.forEach(i=>{(cats[i.cat]=cats[i.cat]||[]).push(i);});
  let html='';
  for(const[cat,items]of Object.entries(cats)){
    html+=`<div class="shop-cat">${cat}</div>`;
    items.forEach((i,idx)=>{
      const id=state.activeWeek+'_'+cat+'_'+idx;
      const done=state.shopChecked[id];
      html+=`<div class="shop-item ${done?'done':''}">
        <input type="checkbox" ${done?'checked':''} onchange="toggleShop('${id.replace(/'/g,"\\'")}')">
        <span class="shop-name">${i.prod}</span>
        <span class="shop-q">${i.qty} ${i.unit}</span></div>`;
    });
  }
  const weekTabs=`<div class="week-tabs" style="margin-top:10px">
    <button class="week-tab ${state.activeWeek===1?'active':''}" onclick="setWeekShop(1)">Tydzień 1</button>
    <button class="week-tab ${state.activeWeek===2?'active':''}" onclick="setWeekShop(2)">Tydzień 2</button></div>`;
  el.innerHTML=`<h2 class="section-h">Lista zakupów</h2>
    <div class="section-sub">Orientacyjne ilości z niewielkim zapasem. Produkty sypkie przechodzą na kolejny tydzień.</div>
    ${modeTabs}${weekTabs}<div class="card">${html}</div>`;
}

// wybor dni + render zakupow dla wybranego zakresu
function renderShopDays(){
  if(!state.shopDays)state.shopDays=[globalDay()];
  const sel=state.shopDays;
  // przyciski wyboru dni 1-14
  const dayBtns=Array.from({length:14},(_,i)=>i+1).map(d=>{
    const inf=dayInfo(d);
    return `<button class="shopday-btn ${sel.includes(d)?'active':''}" onclick="toggleShopDay(${d})">${d}<small>${inf?inf.name.slice(0,2):''}</small></button>`;
  }).join('');

  if(!sel.length)return `<div class="shopday-picker">${dayBtns}</div><div class="empty">Zaznacz dzień lub kilka dni powyżej.</div>`;

  // zbierz skladniki sniadania/pos2/kolacji ze wszystkich wybranych dni
  const snbc={};
  sel.forEach(gd=>{
    const t=daySnbcIngredients(gd);
    for(const[name,v]of Object.entries(t)){
      if(!snbc[name])snbc[name]={qty:0,unit:v.unit,hasNum:false};
      if(v.hasNum){snbc[name].qty+=v.qty;snbc[name].hasNum=true;snbc[name].unit=v.unit;}
    }
  });

  // obiady: dla kazdego wybranego dnia sprawdz batch
  const batchIncluded=[];   // batche kupowane (pierwszy dzien batcha jest zaznaczony)
  const batchNotes=[];      // komunikaty "juz w zakupach z dnia X"
  const seenBatch={};
  sel.slice().sort((a,b)=>a-b).forEach(gd=>{
    const bi=batchInfoForDay(gd);
    if(!bi||!bi.batch)return;
    const bid=bi.batch.id;
    if(seenBatch[bid])return; seenBatch[bid]=true;
    if(bi.isFirstDay){
      batchIncluded.push(bi);
    }else{
      const inf=dayInfo(bi.firstDay);
      const where=sel.includes(bi.firstDay)
        ? `w tych zakupach (dzień ${bi.firstDay})`
        : `w zakupach z dnia ${bi.firstDay} (${inf?inf.name:''})`;
      batchNotes.push(`<b>${bi.obiad.name}</b> — gotowane raz na dni ${bi.firstDay}–${bi.lastDay}, składniki ${where}.`);
    }
  });

  // render skladnikow sniadania/pos2/kolacji
  let snbcHtml=Object.entries(snbc).sort((a,b)=>a[0].localeCompare(b[0])).map(([name,v])=>{
    const q=v.hasNum?`${Math.round(v.qty)} ${v.unit==='szt'?'szt':v.unit}`:v.unit;
    const id='d_'+sel.join('-')+'_'+name;
    const done=state.shopChecked[id];
    return `<div class="shop-item ${done?'done':''}">
      <input type="checkbox" ${done?'checked':''} onchange="toggleShop('${id.replace(/'/g,"\\'")}')">
      <span class="shop-name">${name}</span><span class="shop-q">${q}</span></div>`;
  }).join('');

  // render obiadow-batchy do kupienia
  let batchHtml=batchIncluded.map(bi=>`
    <div class="batch-buy">
      <div class="batch-buy-h">🍲 ${bi.batch.name} <span class="batch-buy-days">dni ${bi.firstDay}–${bi.lastDay}</span></div>
      <div class="batch-buy-warn">UWAGA: składniki na całą partię (${bi.lastDay-bi.firstDay+1} dni obiadów)</div>
      <div class="batch-buy-ingr">${bi.batch.ingr}</div>
    </div>`).join('');

  const notesHtml=batchNotes.length?`<div class="shop-note">${batchNotes.map(n=>`<div>ℹ️ ${n}</div>`).join('')}</div>`:'';

  const label=sel.length===1?`dzień ${sel[0]}`:`dni ${sel.slice().sort((a,b)=>a-b).join(', ')}`;
  return `<div class="shopday-picker">${dayBtns}</div>
    <div class="shop-sel-label">Zakupy na ${label}</div>
    ${notesHtml}
    <div class="card">
      <div class="shop-cat">Śniadania, posiłek 2, kolacje</div>
      ${snbcHtml||'<div class="section-sub">brak</div>'}
      ${batchHtml?`<div class="shop-cat" style="margin-top:18px">Obiady — duże gotowania</div>${batchHtml}`:''}
    </div>`;
}
function setShopMode(m){state.shopMode=m;save();renderZakupy();}
function toggleShopDay(d){
  if(!state.shopDays)state.shopDays=[];
  const i=state.shopDays.indexOf(d);
  if(i>=0)state.shopDays.splice(i,1);else state.shopDays.push(d);
  save();renderZakupy();
}
function setWeekShop(w){state.activeWeek=w;save();renderZakupy();}
function toggleShop(id){
  if(state.shopChecked[id])delete state.shopChecked[id];
  else state.shopChecked[id]=true;
  save();renderZakupy();
}

  const el=document.getElementById('profile');

    const t=state.targets[p.id];

    return `<div class="card profile-card p-${p.color}">
      <div class="profile-name"><span class="dot d-${p.color}"></span>${p.name}</div>
      <div class="profile-goal">${p.goal}</div>
      <div class="macro-row"><label>Cel kalorii</label><div><input type="number" value="${t.kcal}" onchange="setTarget('${p.id}','kcal',this.value)"><span class="unit">kcal</span></div></div>
      ${protRow}</div>`;
  }).join('');
  el.innerHTML=`<h2 class="section-h">Profile i cele</h2>
    <div class="section-sub">Cele orientacyjne (średnia z zakresów w planie). Nie trzeba trzymać się co do kcal — chodzi o kierunek: redukcja u Oliwii, masa u Bartka.</div>
    <div class="grid g3">${cards}</div>
    <div class="note">Plan to praktyczny punkt startowy dla zdrowych osób. Przy chorobach, zaburzeniach cyklu, nieprawidłowym wzrastaniu dziecka lub problemach z jedzeniem — konsultacja z lekarzem lub dietetykiem. Oceniajcie średnią masę ciała z 2–3 tygodni.</div>
    <div class="btn-row">
      <button class="btn ghost" onclick="exportData()">Eksport danych (JSON)</button>
      <button class="btn ghost" onclick="document.getElementById('imp').click()">Import danych</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)"></div>
    <div class="note" style="background:#eef0f4;border-color:var(--slate)">
      <b>Kolejne plany:</b> za 2 tygodnie zrób z ChatGPT nowy 14-dniowy plan i wyślij mi go — dołączę go jako „Plan 2" do biblioteki. Z czasem uzbieracie kilka gotowych bloków do rotacji.</div>`;
}
function setTarget(p,k,v){state.targets[p][k]=+v||0;save();renderDzis();}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dieta_backup.json';a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Wczytano dane');}catch(err){toast('Błędny plik');}};
  r.readAsText(f);
}

// ============ NAV ============
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));

// ============ INIT ============
function boot(){
  try{
    render();
    if(state._migrated){delete state._migrated;save();setTimeout(()=>toast('Zaktualizowano do nowej wersji'),400);}
    initCloud();  // dociąga dane z chmury i włącza synchronizację (jeśli skonfigurowana)
  }catch(err){
    document.querySelector('.wrap').innerHTML=`<div class="card" style="max-width:520px;margin:40px auto;text-align:center">
      <h2 class="section-h">Coś się zacięło</h2>
      <p style="color:var(--slate);margin:12px 0 20px">Zwykle to stare dane w przeglądarce. Kliknij, aby wyczyścić i uruchomić od nowa.</p>
      <button class="btn" onclick="localStorage.removeItem('${KEY}');location.reload()">Wyczyść i uruchom ponownie</button>
      <p style="color:var(--slate);font-size:11px;margin-top:16px">${(err&&err.message)||err}</p></div>`;
    console.error(err);
  }
}
boot();
