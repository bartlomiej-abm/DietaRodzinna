<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dieta rodzinna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#141B2E;
  --steel:#2E4B6B;
  --slate:#7C8BA3;
  --mist:#EDF1F6;
  --paper:#FBFCFE;
  --line:#D6DEE9;
  --oliwia:#7E5AA6;
  --bartek:#2F6FB0;
  --syn:#2E8B8B;
  --ok:#2F8B6C;
  --warn:#C08A2F;
  --over:#C0492F;
  --shadow:0 2px 12px rgba(20,27,46,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--mist);color:var(--navy);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

.topbar{background:var(--navy);color:var(--mist);padding:14px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(20,27,46,.25)}
.brand{font-weight:800;font-size:19px;letter-spacing:.3px}
.brand span{color:var(--slate);font-weight:500}
.sync-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid transparent}
.sync-badge.local{background:rgba(255,255,255,.08);color:var(--slate)}
.sync-badge.syncing{background:#3a3f2e;color:#d8c98a}
.sync-badge.synced{background:#22402f;color:#7fce9f}
.sync-badge.error{background:#40262e;color:#e09ca0}

/* who badge */
.who-badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--mist);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:6px}
.who-badge:hover{background:rgba(255,255,255,.14)}
.who-badge .dot{width:9px;height:9px}

/* lock screen */
.lock-screen{position:fixed;inset:0;background:var(--navy);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.lock-box{background:var(--paper);border-radius:18px;padding:36px 32px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lock-brand{font-weight:800;font-size:24px;margin-bottom:28px;color:var(--navy)}
.lock-brand span{color:var(--slate);font-weight:500}
.lock-label{font-size:14px;color:var(--slate);font-weight:600;margin-bottom:14px}
.lock-input{width:100%;text-align:center;font-size:28px;letter-spacing:8px;border:2px solid var(--line);border-radius:12px;padding:12px;font-weight:700;color:var(--navy);background:#fff}
.lock-input:focus{outline:none;border-color:var(--steel)}
.lock-err{color:var(--over);font-size:13px;font-weight:600;min-height:20px;margin:8px 0}
.lock-btn{width:100%;margin-top:6px}
.lock-people{display:flex;flex-direction:column;gap:12px}
.lock-person{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:17px;font-weight:700;color:var(--navy);transition:.15s}
.lock-person:hover{border-color:var(--steel);background:var(--mist)}
.lock-person .dot{width:14px;height:14px}
.lock-person.p-oliwia:hover{border-color:var(--oliwia)}
.lock-person.p-bartek:hover{border-color:var(--bartek)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:transparent;border:none;color:var(--slate);padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;transition:.15s;display:flex;align-items:center;gap:6px}
.tab:hover{background:rgba(255,255,255,.06);color:var(--mist)}
.tab.active{background:var(--steel);color:#fff}
.tab-ico{display:none;font-size:20px;line-height:1}
.tab-txt{white-space:nowrap}

.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 80px}
.view{display:none;animation:fade .25s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2.section-h{font-size:24px;font-weight:700;margin-bottom:4px}
.section-sub{color:var(--slate);font-size:14px;margin-bottom:22px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g3,.g2{grid-template-columns:1fr}}

/* MOBILE: nawigacja jako dolny pasek */
@media(max-width:720px){
  .topbar{padding:12px 16px;gap:10px}
  .brand{font-size:17px}
  .tabs{
    position:fixed;left:0;right:0;bottom:0;margin:0;z-index:150;
    background:var(--navy);border-top:1px solid rgba(255,255,255,.1);
    padding:6px 4px;gap:0;justify-content:space-around;
    box-shadow:0 -2px 16px rgba(20,27,46,.25);
  }
  .tab{flex-direction:column;gap:2px;padding:6px 4px;flex:1;border-radius:10px;font-size:0}
  .tab-ico{display:block}
  .tab-txt{font-size:10px;font-weight:600}
  .tab.active{background:var(--steel)}
  .tab:hover{background:transparent}
  .tab.active:hover{background:var(--steel)}
  .wrap{padding-bottom:80px}  /* miejsce na dolny pasek */
  .who-badge{padding:4px 10px;font-size:11px}
  .sync-badge{font-size:10px;padding:2px 8px}
}
@media(max-width:380px){
  .brand span{display:none}  /* na bardzo waskich tylko "Dieta" */
  .tab-txt{font-size:9px}
}

.btn{background:var(--steel);color:#fff;border:none;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:600;transition:.15s}
.btn:hover{background:var(--navy)}
.btn.ghost{background:transparent;color:var(--steel);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--mist)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* week + day pickers */
.week-tabs{display:flex;gap:6px;margin-bottom:14px}
.week-tab{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 18px;font-size:14px;font-weight:700;color:var(--steel)}
.week-tab.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.day-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.day-btn{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--steel);text-align:center;min-width:44px}
.day-btn small{display:block;font-size:10px;color:var(--slate);font-weight:500}
.day-btn.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.day-btn.active small{color:#cdd8e6}

/* tracking */
.person-track{margin-bottom:0}
.person-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:4px}
.dot{width:10px;height:10px;border-radius:50%}
.dot.d-oliwia{background:var(--oliwia)}.dot.d-bartek{background:var(--bartek)}.dot.d-syn{background:var(--syn)}
.train-tag{font-size:11px;color:var(--slate);font-weight:500;margin-left:auto}
.bar-wrap{margin:9px 0}
.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.bar-label b{font-weight:600}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .35s ease}
.bar-fill.ok{background:var(--ok)}.bar-fill.warn{background:var(--warn)}.bar-fill.over{background:var(--over)}
.meal-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px}
.meal-item:last-child{border-bottom:none}
.meal-item .chk{width:19px;height:19px;accent-color:var(--steel);cursor:pointer;flex-shrink:0;margin-top:2px}
.meal-item .mbody{flex:1}
.meal-item .mname{font-weight:600}
.meal-item .mslot{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);font-weight:700}
.meal-item .mportion{font-size:12px;color:var(--slate);margin-top:2px}
.meal-item .mkcal{color:var(--slate);font-size:12px;white-space:nowrap;font-weight:600}
.mright{display:flex;align-items:center;gap:8px;flex-shrink:0}
.swap-btn{background:var(--mist);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:14px;line-height:1;cursor:pointer}
.swap-btn:hover{background:var(--line)}
.day-nav{display:flex;gap:8px;margin-bottom:16px}
.day-nav-btn{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--steel);flex:1}
.day-nav-btn.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.obiad-banner{background:#f0f7f7;border:1px solid #d7e8e8;border-left:3px solid var(--syn);padding:11px 15px;border-radius:0 9px 9px 0;font-size:14px;margin-bottom:14px}
.obiad-sub{font-size:12px;color:var(--slate);font-weight:400}
.link-btn{background:none;border:none;color:var(--steel);font-weight:600;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.batch-weight{font-size:13px;color:var(--navy);margin:6px 0 4px}
.batch-portions{font-size:13px;color:var(--slate);margin-bottom:8px}
.batch-portions .dot{display:inline-block;vertical-align:middle}
/* widok tygodnia */
.week-day.today{border:2px solid var(--steel)}
.week-day-head{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.today-tag{font-size:11px;font-weight:700;color:#fff;background:var(--steel);padding:1px 8px;border-radius:20px}
.week-slot{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}
.week-slot-label{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--slate);font-weight:700;width:88px;flex-shrink:0}
.week-slot-name{flex:1}
.week-slot-name.mclick{cursor:pointer}
.week-slot-name.mclick:hover{color:var(--steel)}
/* zakres zakupow */
.range-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.range-row label{font-size:13px;color:var(--steel);font-weight:600;display:flex;flex-direction:column;gap:4px}
.range-row input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;color:var(--navy)}
.range-quick{display:flex;gap:8px;flex-wrap:wrap}
.week-controls{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.week-select{border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600;color:var(--navy);background:#fff}
.shopday-picker{display:flex;gap:5px;flex-wrap:wrap}
.shopday-btn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 0;font-size:13px;font-weight:700;color:var(--steel);width:44px;text-align:center}
.shopday-btn.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.meal-item.done .mname{text-decoration:line-through;color:var(--slate)}
.batch-flag{display:inline-block;font-size:10px;font-weight:700;background:#e7eef6;color:var(--steel);border:1px solid #cfddec;padding:1px 7px;border-radius:20px;margin-left:6px;text-transform:uppercase;letter-spacing:.3px}
.train-switch{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 12px}
.train-opt{background:var(--mist);border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--steel)}
.train-opt.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.moved-tag{font-size:11px;font-weight:600;color:var(--warn);background:#f6efe0;border:1px solid #ecdcc0;padding:2px 8px;border-radius:20px;margin-left:auto}
.meal-item.snack{background:#f0eef6;border-radius:8px;padding-left:8px;padding-right:8px;border-bottom:1px dashed var(--line)}
.meal-item.snack .mslot{color:var(--oliwia)}
.meal-item.snack .mkcal{color:var(--oliwia);font-style:italic}

/* prep banner */
.prep-banner{background:#e7eef6;border-left:3px solid var(--steel);padding:10px 15px;border-radius:0 9px 9px 0;font-size:13px;color:var(--steel);margin-bottom:18px;font-weight:500}
.prep-banner b{font-weight:700}

/* recipes */
.recipe{border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px;background:var(--paper)}
.recipe-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:2px}
.recipe-id{font-size:11px;font-weight:700;color:var(--slate);background:var(--mist);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.recipe-use{font-size:12px;color:var(--slate);margin-bottom:10px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter-chip{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--steel);display:flex;align-items:center;gap:6px}
.filter-chip:hover{background:var(--mist)}
.filter-chip.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.fc-count{font-size:11px;font-weight:700;opacity:.7}
.filter-chip.active .fc-count{opacity:.85}
.recipe-sec{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);font-weight:700;margin:8px 0 3px}
.recipe-txt{font-size:13.5px;color:var(--navy);line-height:1.55}

/* batch */
.batch-card{border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px;background:var(--paper);border-top:3px solid var(--syn)}
.batch-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.batch-days{font-size:12px;font-weight:700;color:var(--syn);background:#e2eef0;border:1px solid #c7e0e2;padding:2px 9px;border-radius:20px}

/* shopping */
.shop-cat{font-weight:700;color:var(--steel);margin:16px 0 6px;font-size:15px}
.shop-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.shop-item input{width:18px;height:18px;accent-color:var(--steel)}
.shop-item.done .shop-name{text-decoration:line-through;color:var(--slate)}
.shop-name{flex:1}
.shop-q{font-weight:700;color:var(--steel);font-size:13px}
.shopday-picker{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.shopday-btn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:13px;font-weight:700;color:var(--steel);width:42px;text-align:center;line-height:1.1}
.shopday-btn small{display:block;font-size:9px;color:var(--slate);font-weight:500;text-transform:uppercase}
.shopday-btn.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.shopday-btn.active small{color:#cdd8e6}
.shop-sel-label{font-weight:700;font-size:15px;margin-bottom:12px;color:var(--navy)}
.shop-note{background:#f6efe0;border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 9px 9px 0;font-size:13px;color:#7a5b1f;margin-bottom:14px}
.shop-note div{margin:3px 0}
.batch-buy{border:1px solid var(--line);border-left:3px solid var(--syn);border-radius:8px;padding:12px 14px;margin:8px 0;background:#f5fafa}
.batch-buy-h{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.batch-buy-days{font-size:11px;font-weight:700;color:var(--syn);background:#e2eef0;border:1px solid #c7e0e2;padding:1px 8px;border-radius:20px}
.batch-buy-warn{font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.3px;margin:5px 0}
.batch-buy-ingr{font-size:13px;color:var(--navy);line-height:1.5}

.note{background:#e7eef6;border-left:3px solid var(--steel);padding:12px 16px;border-radius:0 9px 9px 0;font-size:13px;color:var(--steel);margin:16px 0}
.empty{text-align:center;color:var(--slate);padding:50px 20px;font-size:15px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3);transition:.3s;z-index:200;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* klikalne danie */
.mname.mclick{cursor:pointer;transition:color .12s}
.mname.mclick:hover{color:var(--steel)}
.recipe-arrow{color:var(--slate);font-weight:700;font-size:16px;opacity:.6}
.mname.mclick:hover .recipe-arrow{opacity:1;color:var(--steel)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,27,46,.55);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:300;padding:40px 16px;overflow-y:auto}
.modal-overlay.open{display:flex;animation:fade .2s}
.modal-box{background:var(--paper);border-radius:16px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(20,27,46,.4);position:relative;margin:auto}
.modal-close{position:absolute;top:14px;right:16px;background:var(--mist);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:20px;line-height:1;color:var(--slate);font-weight:600}
.modal-close:hover{background:var(--line)}
.modal-title{font-size:20px;font-weight:700;padding-right:40px;line-height:1.25}
.modal-sub{display:block;font-size:12px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.modal-body{margin-top:16px}
.modal-sec{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);font-weight:700;margin:16px 0 5px}
.modal-txt{font-size:14px;color:var(--navy);line-height:1.6}
.modal-portions{background:var(--mist);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.9}
.modal-portions .dot{display:inline-block;vertical-align:middle;margin-right:2px}
.modal-kcal{font-size:12px;color:var(--slate);margin-top:6px;text-align:right}
.modal-note{background:#eef0f4;border-left:3px solid var(--slate);padding:11px 14px;border-radius:0 9px 9px 0;font-size:13px;color:var(--steel);margin-top:14px}
.modal-sos{background:#f5fafa;border:1px solid #d7e8e8;border-radius:9px;padding:10px 13px;margin:7px 0;font-size:13.5px}
.card-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.card-modes{margin-bottom:14px}
.card-tab{background:var(--mist);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--steel);display:flex;align-items:center;gap:5px}
.card-tab.active{background:var(--steel);color:#fff;border-color:var(--steel)}
.card-tab .dot{width:8px;height:8px}
.macro-table{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.macro-cell{flex:1;min-width:52px;background:var(--mist);border-radius:10px;padding:10px 6px;text-align:center}
.macro-cell.hl{background:var(--steel);color:#fff}
.mc-val{display:block;font-size:20px;font-weight:800;line-height:1.1}
.mc-lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.3px;opacity:.7;margin-top:2px}
.ingr-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.ingr-row{display:flex;justify-content:space-between;padding:8px 12px;font-size:13.5px;border-bottom:1px solid var(--line)}
.ingr-row:last-child{border-bottom:none}
.ingr-g{font-weight:700;color:var(--steel)}
.macro-mini{display:block;font-size:11px;color:var(--slate);margin-top:2px}
.cooked-box{background:#f5fafa;border:1px solid #d7e8e8;border-radius:10px;padding:14px;margin-bottom:14px}
.cooked-input{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600}
.cooked-input input{width:90px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:15px;font-weight:700;color:var(--navy)}
.block-portion{font-size:13.5px;padding:5px 0;line-height:1.5}
.block-portion .dot{display:inline-block;vertical-align:middle}
.adj-tag{font-size:10px;font-weight:700;color:var(--warn);background:#f6efe0;padding:1px 6px;border-radius:10px;text-transform:uppercase}
.batch-h.mclick{cursor:pointer}
.batch-h.mclick:hover{color:var(--steel)}
.modal-sos b{color:var(--syn)}

.profile-card.p-syn{border-top-color:var(--syn)}

.profile-goal{font-size:12.5px;color:var(--slate);margin-bottom:14px}

}

// ===== MAKRO =====
function calcMacroFromIngr(ingr){
  const m={kcal:0,protein:0,carbs:0,fat:0,fiber:0};
  (ingr||[]).forEach(it=>{
    const p=productById(it.pid);if(!p||it.qty==null)return;
    const f=it.qty/100;
    m.kcal+=p.kcal*f;m.protein+=p.p*f;m.carbs+=p.c*f;m.fat+=p.f*f;m.fiber+=(p.fb||0)*f;
  });
  return m;
}
function poolMacro(item,personId){
  if(item.macro&&item.macro[personId]){
    const g=item.macro[personId];
    return {kcal:g.kcal,protein:g.p,carbs:g.c,fat:g.f,fiber:g.fb,portionG:g.portionG};
  }
  if(item.recipes&&item.recipes[personId])return calcMacroFromIngr(item.recipes[personId]);
  return null;
}
function blockMacro(block,personId){
  const g=block.macro&&block.macro[personId];
  if(!g)return null;
  const actual=state.cookedWeight&&state.cookedWeight[block.id];
  if(actual&&block.batchWeight&&actual!==block.batchWeight){
    const ratio=block.batchWeight/actual;
    return {kcal:Math.round(g.kcal*ratio),protein:+(g.p*ratio).toFixed(1),carbs:+(g.c*ratio).toFixed(1),
      fat:+(g.f*ratio).toFixed(1),fiber:+(g.fb*ratio).toFixed(1),portionG:g.portionG,adjusted:true};
  }
  return {kcal:g.kcal,protein:g.p,carbs:g.c,fat:g.f,fiber:g.fb,portionG:g.portionG};
}

// policz zakupy z listy dni — z receptur produktowych (precyzyjnie)
function shoppingFromDays(daysList){
  const totals={};  // productName -> {qty, unit}
  const add=(name,qty)=>{if(!totals[name])totals[name]={qty:0,unit:'g'};totals[name].qty+=qty;};
  daysList.forEach(day=>{
    if(!day)return;
    SLOTS_DEF.forEach(sdef=>{
      if(sdef.isBlock)return;
      const item=poolItem(day.slots[sdef.key]);if(!item||!item.recipes)return;
      sdef.people.forEach(pid=>{
        const rec=item.recipes[pid];if(!rec)return;
        rec.forEach(ing=>{const p=productById(ing.pid);if(p&&ing.qty)add(p.name,ing.qty);});
      });
    });
    const b=blockById(day.obiadBlock);
    if(b&&b.recipeBatch){
      b.recipeBatch.forEach(ing=>{const p=productById(ing.pid);if(p&&ing.qty)add(p.name,ing.qty/2);});
    }
  });
  return totals;
}

// day = { obiadBlock:'O01', slots:{ sniadanie:'P01', ii_sniadanie:'P18', lekki_lunch:'P21', kolacja:'P29' } }
function randFrom(arr,exclude){
  const pool=arr.filter(x=>x!==exclude);
  const src=pool.length?pool:arr;
  return src[Math.floor(Math.random()*src.length)];
}
// wygeneruj losowy dzień (obiad przypisywany na poziomie tygodnia)
function genDay(prev){
  const pick=(cat,ex)=>{const ids=poolByCat(cat).map(d=>d.id);return randFrom(ids,ex);};
  const prevSlots=prev&&prev.slots||{};
  return {
    slots:{
      sniadanie:pick('sniadanie',prevSlots.sniadanie),
      ii_sniadanie:pick('ii_sniadanie',prevSlots.ii_sniadanie),
      lekki_lunch:pick('lekki_lunch',prevSlots.lekki_lunch),
      kolacja:pick('kolacja',prevSlots.kolacja)
    }
  };
}

// wygeneruj cały tydzień (7 dni Pon-Nd). Obiady: bloki po 2 dni (3.5 bloku na tydzień).
function genWeek(id){
  const days=[];let prev=null;
  // rozłóż bloki obiadowe: co 2 dni nowy blok, rotując po liście
  let blockIdx=Math.floor(Math.random()*MOD.blocks.length);
  for(let i=0;i<7;i++){
    const d=genDay(prev);
    d.obiadBlock=MOD.blocks[blockIdx%MOD.blocks.length].id;
    if(i%2===1)blockIdx++;  // zmiana bloku co 2 dni
    days.push(d);prev=d;
  }
  return {id,days,created:Date.now()};
}

    log:{},shopChecked:{},trainOverride:{},snackLog:{},cookedWeight:{}};
}
function normalizeShared(s){
  if(!s||typeof s!=='object')return freshState();
  const f=freshState();
  if(!Array.isArray(s.weeks)||!s.weeks.length)return f;  // brak tygodni -> świeży
  // WALIDACJA: czy dania w tygodniach pasują do aktualnej puli (po zmianie modelu ID mogły się zmienić)
  const weeksValid=s.weeks.every(w=>w.days&&w.days.every(d=>{
    if(!d.slots)return false;
    // każdy slot pulowy musi wskazywać istniejące danie
    return ['sniadanie','ii_sniadanie','lekki_lunch','kolacja'].every(k=>!d.slots[k]||poolItem(d.slots[k]));
  }));
  if(!weeksValid)return f;  // stary format dań -> świeży tydzień z aktualnej puli
  return {schema:SCHEMA,
    targets:s.targets||f.targets,
    weeks:s.weeks, curWeekId:s.curWeekId||s.weeks[s.weeks.length-1].id, nextWeekId:s.nextWeekId||(Math.max(...s.weeks.map(w=>w.id))+1),
    log:s.log||{},shopChecked:s.shopChecked||{},
    trainOverride:s.trainOverride||{},snackLog:s.snackLog||{},cookedWeight:s.cookedWeight||{}};
}

// losuj nowy tydzień -> staje się bieżącym, stare do historii (limit MAX_WEEKS)
function rollNewWeek(){
  const w=genWeek(state.nextWeekId);
  state.weeks.push(w);
  state.curWeekId=w.id;
  state.nextWeekId=w.id+1;
  // przytnij historię
  if(state.weeks.length>MAX_WEEKS){
    const removed=state.weeks.splice(0,state.weeks.length-MAX_WEEKS);
    // wyczyść logi usuniętych tygodni
    removed.forEach(rw=>{
      Object.keys(state.log).forEach(k=>{if(k.startsWith(rw.id+'_'))delete state.log[k];});
      Object.keys(state.trainOverride).forEach(k=>{if(k.startsWith(rw.id+'_'))delete state.trainOverride[k];});
      Object.keys(state.snackLog).forEach(k=>{if(k.startsWith(rw.id+'_'))delete state.snackLog[k];});
    });
  }
  nav.viewWeekId=w.id;nav.activeDayIdx=0;saveNav();
  save();
}

// dane slotu dla osoby
function slotData(day,slotKey,personId){
  const def=SLOTS_DEF.find(s=>s.key===slotKey);
  if(!def||!def.people.includes(personId))return null;
  if(def.isBlock){
    const b=blockById(day.obiadBlock);if(!b)return null;
    const m=blockMacro(b,personId);if(!m)return null;
    return {name:b.name,block:b,macro:m,kcal:m.kcal,portion:m.portionG,isBlock:true};
  }
  const id=day.slots[slotKey];const item=poolItem(id);if(!item)return null;
  const m=poolMacro(item,personId);if(!m)return null;
  return {name:item.name,item,macro:m,kcal:m.kcal,portionG:m.portionG,prep:item.prep,ingrText:item.ingrText};
}

// ============ RENDER ============
function render(){renderDzis();renderPlan();renderPrzepisy();renderBatch();renderZakupy();renderProfile();}

// ---- TRENINGI (przekładanie) — teraz per dzień-data ----
function trainFor(personId,key){
  key=key||curLogKey();
  const ov=state.trainOverride[key];
  if(ov&&ov[personId]!==undefined)return ov[personId];
  return 'odpoczynek';  // domyślnie brak; ustawiasz w widoku Dziś
}
function setTrain(personId,key,val){
  if(!state.trainOverride[key])state.trainOverride[key]={};
  if(val==='odpoczynek')delete state.trainOverride[key][personId];
  else state.trainOverride[key][personId]=val;
  save();renderDzis();
}
function trainHasSnack(t){
  if(!t)return false;
  return !t.toLowerCase().includes('odpocz');
}
function toggleSnack(personId,key){
  if(!state.snackLog[key])state.snackLog[key]={};
  if(state.snackLog[key][personId])delete state.snackLog[key][personId];
  else state.snackLog[key][personId]=true;
  save();renderDzis();
}

// ---- PRZEPIS W POP-UPIE ----
function normName(s){return (s||'').toLowerCase().replace(/[^a-ząćęłńóśźż0-9 ]/g,'').trim();}
// otworz modal z przepisem dla dania (slotKey) danego dnia
let cardView={dishId:null,person:'bartek',mode:'porcja'};
function openRecipe(slotKey,personId){
  const day=curDay();if(!day)return;
  const def=SLOTS_DEF.find(s=>s.key===slotKey);
  if(def.isBlock){openBlock(day.obiadBlock);return;}
  const item=poolItem(day.slots[slotKey]);if(!item)return;
  cardView={dishId:item.id,person:personId||'bartek',mode:'porcja'};
  renderCard();
}
function renderCard(){
  const item=poolItem(cardView.dishId);if(!item)return;
  const person=cardView.person, mode=cardView.mode;
  const eaters=PEOPLE.filter(p=>item.macro&&item.macro[p.id]);
  if(!eaters.find(e=>e.id===person)&&eaters.length)cardView.person=eaters[0].id;
  const personTabs=eaters.map(p=>`<button class="card-tab ${cardView.person===p.id?'active':''}" onclick="setCardPerson('${p.id}')"><span class="dot d-${p.color}"></span>${p.name}</button>`).join('');
  const modeTabs=[['porcja','Moja porcja'],['100g','Na 100 g'],['przepis','Cały przepis']]
    .map(([m,l])=>`<button class="card-tab ${mode===m?'active':''}" onclick="setCardMode('${m}')">${l}</button>`).join('');
  const recipe=item.recipes&&item.recipes[cardView.person];
  let macroBox='';
  if(mode==='porcja'){
    const m=poolMacro(item,cardView.person);
    macroBox=macroTable(m, item.macro[cardView.person]&&item.macro[cardView.person].portionG);
  }else if(mode==='100g'){
    const m=calcMacroFromIngr(recipe);
    const totalG=(recipe||[]).reduce((s,i)=>s+(i.qty||0),0);
    const per100=totalG?{kcal:m.kcal/totalG*100,protein:m.protein/totalG*100,carbs:m.carbs/totalG*100,fat:m.fat/totalG*100,fiber:m.fiber/totalG*100}:m;
    macroBox=macroTable(per100,100)+`<div class="modal-txt" style="font-size:12px;color:var(--slate)">Cała porcja waży ~${Math.round(totalG)} g</div>`;
  }else{
    const m=calcMacroFromIngr(recipe);
    let ingrList=(recipe||[]).map(i=>{const p=productById(i.pid);return `<div class="ingr-row"><span>${p?p.name:i.pid}</span><span class="ingr-g">${i.qty} g</span></div>`;}).join('');
    macroBox=`<div class="ingr-list">${ingrList}</div>`+macroTable(m,null);
  }
  let body=`<div class="card-tabs">${personTabs}</div>
    <div class="card-tabs card-modes">${modeTabs}</div>${macroBox}`;
  if(item.prep){body+=`<div class="modal-sec">Przygotowanie</div><div class="modal-txt">${item.prep}</div>`;}
  document.getElementById('modalTitle').innerHTML=`${item.name}<span class="modal-sub">${catLabel(item.cat)}</span>`;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modal').classList.add('open');
}
function setCardPerson(p){cardView.person=p;renderCard();}
function setCardMode(m){cardView.mode=m;renderCard();}
function catLabel(c){return {sniadanie:'Śniadanie',ii_sniadanie:'II śniadanie',lekki_lunch:'Lekki lunch',kolacja:'Kolacja',obiad:'Obiad'}[c]||c;}
function macroTable(m,portionG){
  if(!m)return '<div class="modal-note">Brak danych makro.</div>';
  return `<div class="macro-table">
    ${portionG?`<div class="macro-cell"><span class="mc-val">${Math.round(portionG)}</span><span class="mc-lbl">g porcja</span></div>`:''}
    <div class="macro-cell hl"><span class="mc-val">${Math.round(m.kcal)}</span><span class="mc-lbl">kcal</span></div>
    <div class="macro-cell"><span class="mc-val">${m.protein.toFixed(0)}</span><span class="mc-lbl">białko</span></div>
    <div class="macro-cell"><span class="mc-val">${m.carbs.toFixed(0)}</span><span class="mc-lbl">węgle</span></div>
    <div class="macro-cell"><span class="mc-val">${m.fat.toFixed(0)}</span><span class="mc-lbl">tłuszcz</span></div>
    <div class="macro-cell"><span class="mc-val">${m.fiber.toFixed(0)}</span><span class="mc-lbl">błonnik</span></div>
  </div>`;
}
function closeModal(){document.getElementById('modal').classList.remove('open');}

// ---- DZIŚ (model rotacyjny) ----
function renderDzis(){
  const el=document.getElementById('dzis');
  const week=viewWeek();
  const dayIdx=nav.activeDayIdx!=null?nav.activeDayIdx:todayIdx();
  const day=week.days[dayIdx];
  const logKey=dayLogKey(week.id,dayIdx);
  const log=state.log[logKey]||{};
  const isCurWeek=week.id===state.curWeekId;
  const isToday=isCurWeek && dayIdx===todayIdx();

  // pasek wyboru dnia Pon-Nd
  const dayBtns=DAY_SHORT.map((nm,i)=>`<button class="day-btn ${i===dayIdx?'active':''}" onclick="setDayIdx(${i})">${nm}</button>`).join('');

  const people=PEOPLE.map(p=>{
    const t=state.targets[p.id];
    let eaten={kcal:0,protein:0,carbs:0,fat:0,fiber:0};
    const plog=log[p.id]||{};
    const curTrain=trainFor(p.id,logKey);
    const showSnack = p.id!=='syn' && trainHasSnack(curTrain);
    const snackDone = state.snackLog[logKey]&&state.snackLog[logKey][p.id];

    const slots=SLOTS_DEF.filter(s=>s.people.includes(p.id));
    let rows='';
    slots.forEach(sdef=>{
      const sd=slotData(day,sdef.key,p.id);
      if(!sd)return;
      const mkey=sdef.key;const done=plog[mkey];const m=sd.macro;
      if(done&&m){eaten.kcal+=m.kcal;eaten.protein+=m.protein;eaten.carbs+=m.carbs;eaten.fat+=m.fat;eaten.fiber+=m.fiber;}
      const canSwap=!sd.isBlock;
      const portionTxt = sd.isBlock ? `porcja ${sd.portion||'?'} g${m&&m.adjusted?' (przeliczone)':''}` : (sd.portionG?`~${sd.portionG} g`:'');
      const macroLine = m ? `<span class="macro-mini">B${Math.round(m.protein)} W${Math.round(m.carbs)} T${Math.round(m.fat)} bł${Math.round(m.fiber)}</span>` : '';
      rows+=`<div class="meal-item ${done?'done':''}">
        <input type="checkbox" class="chk" ${done?'checked':''} onchange="toggleMeal('${p.id}','${mkey}')">
        <div class="mbody"><span class="mslot">${sdef.label}</span>
        <div class="mname mclick" onclick="openRecipe('${mkey}','${p.id}')">${sd.name} <span class="recipe-arrow">›</span></div>
        ${portionTxt?`<div class="mportion">${portionTxt}</div>`:''}
        ${macroLine}</div>
        <div class="mright">
          <span class="mkcal">${Math.round(sd.kcal)} kcal</span>
          ${canSwap?`<button class="swap-btn" onclick="event.stopPropagation();swapSlot(${dayIdx},'${mkey}')" title="inne danie">🎲</button>`:''}
        </div></div>`;
      if(mkey==='ii_sniadanie' && showSnack){
        rows+=`<div class="meal-item snack ${snackDone?'done':''}">
          <input type="checkbox" class="chk" ${snackDone?'checked':''} onchange="toggleSnack('${p.id}','${logKey}')">
          <div class="mbody"><span class="mslot">Przed treningiem</span>
          <div class="mname">${PRE_SNACK.name}</div>
          <div class="mportion">${PRE_SNACK.hint}</div></div>
          <span class="mkcal">+ wg biegu</span></div>`;
      }
    });

    const trainSwitch = p.id==='syn' ? '' : `
      <div class="train-switch">
        ${TRAIN_OPTS.map(o=>`<button class="train-opt ${curTrain===o?'active':''}" onclick="setTrain('${p.id}','${logKey}','${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
      </div>`;

    let bars=bar('Kalorie',Math.round(eaten.kcal),t.kcal,'kcal');
    if(t.protein){bars+=bar('Białko',Math.round(eaten.protein),Math.round(t.protein),'g');}
    if(t.carbs){bars+=bar('Węgle',Math.round(eaten.carbs),Math.round(t.carbs),'g');}
    if(t.fat){bars+=bar('Tłuszcz',Math.round(eaten.fat),Math.round(t.fat),'g');}
    if(t.fiber){bars+=bar('Błonnik',Math.round(eaten.fiber),Math.round(t.fiber),'g');}

    return `<div class="card person-track">
      <div class="person-head"><span class="dot d-${p.color}"></span>${p.name}</div>
      ${trainSwitch}
      ${bars}
      <div style="margin-top:12px">${rows}</div></div>`;
  }).join('');

  const block=blockById(day.obiadBlock);
  const weekLabel = isCurWeek ? 'Bieżący tydzień' : `Tydzień ${week.id}`;
  el.innerHTML=`<h2 class="section-h">${DAY_NAMES[dayIdx]}${isToday?' — dziś':''}</h2>
    <div class="section-sub">${weekLabel}. Kliknij 🎲 przy daniu, by wylosować inne z tej samej puli. Kalorie orientacyjne.</div>
    <div class="day-picker">${dayBtns}</div>
    <div class="obiad-banner">🍲 <b>Obiad:</b> ${block?block.name:'—'} <span class="obiad-sub">— gotowany blokiem na 2 dni. <button class="link-btn" onclick="rerollBlock(${dayIdx})">zmień blok</button></span></div>
    <div class="btn-row" style="margin:0 0 18px"><button class="btn" onclick="rerollDay(${dayIdx})">🎲 Wylosuj ten dzień od nowa</button></div>
    <div class="grid g3">${people}</div>`;
}
function bar(label,val,target,unit){
  const pct=target&&val!=null?Math.min(100,Math.round(val/target*100)):0;
  const cls=pct<85?'ok':pct<=105?'warn':'over';
  return `<div class="bar-wrap"><div class="bar-label"><span>${label}</span><b>${val} / ${target} ${unit}</b></div>
    <div class="bar"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div></div>`;
}
function setDayIdx(i){nav.activeDayIdx=i;saveNav();renderDzis();}
// odhaczanie posiłku (klucz = weekId_dayIdx)
function toggleMeal(person,slotKey){
  const key=curLogKey();
  if(!state.log[key])state.log[key]={};
  if(!state.log[key][person])state.log[key][person]={};
  if(state.log[key][person][slotKey])delete state.log[key][person][slotKey];
  else state.log[key][person][slotKey]=true;
  save();renderDzis();
}
// podmień jedno danie w slocie danego dnia tygodnia
function swapSlot(dayIdx,slotKey){
  const week=viewWeek();const day=week.days[dayIdx];if(!day)return;
  const def=SLOTS_DEF.find(s=>s.key===slotKey);if(!def||def.isBlock)return;
  const ids=poolByCat(def.key).map(d=>d.id);
  day.slots[slotKey]=randFrom(ids,day.slots[slotKey]);
  save();renderDzis();
}
function rerollDay(dayIdx){
  const week=viewWeek();const prev=week.days[dayIdx];
  const nd=genDay(prev);nd.obiadBlock=prev.obiadBlock;
  week.days[dayIdx]=nd;save();renderDzis();
}
function rerollBlock(dayIdx){
  const week=viewWeek();const day=week.days[dayIdx];if(!day)return;
  const idx=MOD.blocks.findIndex(b=>b.id===day.obiadBlock);
  day.obiadBlock=MOD.blocks[(idx+1)%MOD.blocks.length].id;
  save();renderDzis();
}

    <button class="week-tab ${nav.planMode==='pule'?'active':''}" onclick="setPlanMode('pule')">Pule dań</button></div>`;

  if(nav.planMode==='tydzien'){el.innerHTML=`<h2 class="section-h">Plan tygodnia</h2>
    <div class="section-sub">Podgląd wylosowanych dni. Podmieniaj dania 🎲, a lista zakupów policzy się z tego, co wybierzecie.</div>
    ${modeTabs}${renderWeekView()}`;return;}

  // --- TRYB PULE ---
  const cats=[
    {key:'sniadanie',label:'Śniadania'},
    {key:'ii_sniadanie',label:'II śniadania'},
    {key:'lekki_lunch',label:'Lekkie lunche (Bartek)'},
    {key:'kolacja',label:'Kolacje'}

        <div class="mname mclick" onclick="openPoolItem('${d.id}')">${d.name} <span class="recipe-arrow">›</span></div>
        <div class="mportion">O ${d.macro&&d.macro.oliwia?Math.round(d.macro.oliwia.kcal):'—'} · B ${d.macro&&d.macro.bartek?Math.round(d.macro.bartek.kcal):'—'} · Teoś ${d.macro&&d.macro.syn?Math.round(d.macro.syn.kcal):'—'} kcal</div>
      </div></div>`).join('');
    return `<div class="card" style="margin-bottom:14px">
      <div style="font-weight:700;font-size:16px;margin-bottom:8px">${c.label} <span style="color:var(--slate);font-size:13px;font-weight:500">(${dania.length})</span></div>
      ${rows}</div>`;
  }).join('');
  const blockRows=MOD.blocks.map(b=>`<div class="meal-item" style="padding:9px 0">
    <div class="mbody">
      <div class="mname mclick" onclick="openBlock('${b.id}')">${b.name} <span class="recipe-arrow">›</span></div>
      <div class="mportion">partia ~${b.batchWeight} g / ${b.portions} porcji · porcja B ${b.macro&&b.macro.bartek?Math.round(b.macro.bartek.kcal):'—'} kcal</div>
    </div></div>`).join('');
  html+=`<div class="card"><div style="font-weight:700;font-size:16px;margin-bottom:8px">Obiady — bloki na 2 dni <span style="color:var(--slate);font-size:13px;font-weight:500">(${MOD.blocks.length})</span></div>${blockRows}</div>`;

  el.innerHTML=`<h2 class="section-h">Pule dań</h2>
    <div class="section-sub">Wszystkie dania do rotacji. Kliknij danie, by zobaczyć przepis i porcje.</div>
    ${modeTabs}${html}`;
}
function setPlanMode(m){nav.planMode=m;saveNav();renderPlan();}
// widok tygodnia Pon-Nd z historią
function renderWeekView(){
  const week=viewWeek();
  const isCur=week.id===state.curWeekId;
  // selektor tygodnia (historia)
  const weekOpts=state.weeks.slice().reverse().map(w=>{
    const label=w.id===state.curWeekId?`Tydzień ${w.id} (bieżący)`:`Tydzień ${w.id}`;
    return `<option value="${w.id}" ${w.id===week.id?'selected':''}>${label}</option>`;
  }).join('');

  let html=week.days.map((day,idx)=>{
    const block=blockById(day.obiadBlock);
    const slotRows=SLOTS_DEF.map(sdef=>{
      if(sdef.isBlock){
        return `<div class="week-slot"><span class="week-slot-label">${sdef.label}</span>
          <span class="week-slot-name mclick" onclick="openBlock('${day.obiadBlock}')">${block?block.name:'—'}</span>
          <button class="swap-btn" onclick="swapDayBlock(${idx})" title="zmień blok">🎲</button></div>`;
      }
      const it=poolItem(day.slots[sdef.key]);
      return `<div class="week-slot"><span class="week-slot-label">${sdef.label}</span>
        <span class="week-slot-name mclick" onclick="openPoolItem('${it?it.id:''}')">${it?it.name:'—'}</span>
        <button class="swap-btn" onclick="swapDaySlot(${idx},'${sdef.key}')" title="inne danie">🎲</button></div>`;
    }).join('');
    const isToday=isCur && idx===todayIdx();
    return `<div class="card week-day ${isToday?'today':''}" style="margin-bottom:12px">
      <div class="week-day-head"><b>${DAY_NAMES[idx]}</b>${isToday?' <span class="today-tag">dziś</span>':''}
        <button class="link-btn" style="margin-left:auto" onclick="rerollDayInWeek(${idx})">🎲 losuj dzień</button></div>
      ${slotRows}</div>`;
  }).join('');

  const controls=`<div class="week-controls">
    <select class="week-select" onchange="viewWeekSelect(this.value)">${weekOpts}</select>
    <button class="btn" onclick="confirmNewWeek()">🎲 Losuj nowy tydzień</button>
  </div>`;
  return controls+html;
}
function viewWeekSelect(id){nav.viewWeekId=+id;saveNav();renderPlan();}
function confirmNewWeek(){
  rollNewWeek();
  toast('Wylosowano nowy tydzień');
  renderPlan();
}
function swapDaySlot(dayIdx,slotKey){
  const week=viewWeek();const day=week.days[dayIdx];if(!day)return;
  const def=SLOTS_DEF.find(s=>s.key===slotKey);if(!def||def.isBlock)return;
  const ids=poolByCat(def.key).map(d=>d.id);
  day.slots[slotKey]=randFrom(ids,day.slots[slotKey]);
  save();renderPlan();
}
function swapDayBlock(dayIdx){
  const week=viewWeek();const day=week.days[dayIdx];if(!day)return;
  const idx=MOD.blocks.findIndex(b=>b.id===day.obiadBlock);
  day.obiadBlock=MOD.blocks[(idx+1)%MOD.blocks.length].id;
  save();renderPlan();
}
function rerollDayInWeek(dayIdx){
  const week=viewWeek();const prev=week.days[dayIdx];
  const nd=genDay(prev);nd.obiadBlock=prev.obiadBlock;
  week.days[dayIdx]=nd;save();renderPlan();
}
// otwórz przepis dla dania z puli (z widoku Plan)
function openPoolItem(id){
  const it=poolItem(id);if(!it)return;
  cardView={dishId:id,person:'bartek',mode:'porcja'};
  renderCard();
}
function openBlock(id){
  const b=blockById(id);if(!b)return;
  const actual=(state.cookedWeight&&state.cookedWeight[id])||b.batchWeight;
  let portionsHtml='';
  PEOPLE.forEach(p=>{

    portionsHtml+=`<div class="block-portion"><span class="dot d-${p.color}"></span> <b>${p.name}:</b>
      porcja ~${Math.round(m.portionG||0)} g · ${Math.round(m.kcal)} kcal · B${Math.round(m.protein)} W${Math.round(m.carbs)} T${Math.round(m.fat)} bł${Math.round(m.fiber)}${m.adjusted?' <span class="adj-tag">przeliczone</span>':''}</div>`;
  });
  let body=`<div class="cooked-box">
      <div class="modal-sec" style="margin-top:0">Masa ugotowanego garnka</div>
      <div class="modal-txt" style="font-size:13px;margin-bottom:8px">Planowana: ~${b.batchWeight} g. Po ugotowaniu zważ garnek i wpisz rzeczywistą masę — makro porcji przeliczy się (kalorie całej partii zostają, zmienia się gęstość).</div>
      <div class="cooked-input">
        <input type="number" id="cookedInput" value="${actual}" placeholder="${b.batchWeight}"> g
        <button class="btn sm" onclick="setCookedWeight('${id}')">Zapisz masę</button>
        ${state.cookedWeight&&state.cookedWeight[id]?`<button class="btn ghost sm" onclick="resetCookedWeight('${id}')">reset</button>`:''}
      </div>
    </div>
    <div class="modal-sec">Porcje na osobę</div>${portionsHtml}
    <div class="modal-sec">Składniki całej partii</div><div class="modal-txt">${b.ingrAll}</div>
    <div class="modal-sec">Przyprawy</div><div class="modal-txt">${b.spice||'—'}</div>
    <div class="modal-sec">Przechowywanie</div><div class="modal-txt">${b.store||'—'}</div>`;
  if(b.prep)body+=`<div class="modal-sec">Przygotowanie</div><div class="modal-txt">${b.prep}</div>`;
  document.getElementById('modalTitle').innerHTML=`${b.name}<span class="modal-sub">obiad · blok 2 dni</span>`;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modal').classList.add('open');
}
function setCookedWeight(id){
  const v=+document.getElementById('cookedInput').value;
  if(!v||v<=0){toast('Podaj poprawną masę');return;}
  if(!state.cookedWeight)state.cookedWeight={};
  state.cookedWeight[id]=v;save();openBlock(id);renderDzis();toast('Zapisano masę garnka');
}
function resetCookedWeight(id){
  if(state.cookedWeight)delete state.cookedWeight[id];
  save();openBlock(id);renderDzis();
}

// ---- PRZEPISY ----
// kategoria przepisu na podstawie pola "use"
function recipeCat(use){
  const u=(use||'').toLowerCase();
  if(u.includes('śniad'))return 'sniadanie';
  if(u.includes('obiad'))return 'obiad';
  if(u.includes('kolacj'))return 'kolacja';
  if(u.includes('sos'))return 'sos';
  if(u.includes('posiłek 2')||u.includes('paliwo')||u.includes('long run'))return 'posilek2';
  return 'inne';
}
const RECIPE_FILTERS=[
  {id:'all',label:'Wszystkie'},
  {id:'sniadanie',label:'Śniadania'},
  {id:'posilek2',label:'Posiłek 2'},
  {id:'obiad',label:'Obiady'},
  {id:'kolacja',label:'Kolacje'},
  {id:'sos',label:'Sosy'}
];
let recipeFilter='all';

function renderPrzepisy(){
  const el=document.getElementById('przepisy');
  const cats=[
    {id:'all',label:'Wszystkie'},
    {id:'sniadanie',label:'Śniadania'},
    {id:'ii_sniadanie',label:'II śniadania'},
    {id:'lekki_lunch',label:'Lunche'},
    {id:'kolacja',label:'Kolacje'},
    {id:'obiad',label:'Obiady'}
  ];
  const allItems=[...MOD.pool, ...MOD.blocks.map(b=>({...b,cat:'obiad',isBlock:true}))];
  const counts={};allItems.forEach(x=>{counts[x.cat]=(counts[x.cat]||0)+1;});
  const filtered=recipeFilter==='all'?allItems:allItems.filter(x=>x.cat===recipeFilter);

  const chips=cats.filter(f=>f.id==='all'||counts[f.id]).map(f=>{
    const n=f.id==='all'?allItems.length:counts[f.id];
    return `<button class="filter-chip ${recipeFilter===f.id?'active':''}" onclick="setRecipeFilter('${f.id}')">${f.label} <span class="fc-count">${n}</span></button>`;
  }).join('');

  const r=filtered.map(x=>{
    const onclick = x.isBlock ? `openBlock('${x.id}')` : `openPoolItem('${x.id}')`;
    const macroHint = x.isBlock ? `porcja B ${x.macro&&x.macro.bartek?Math.round(x.macro.bartek.kcal):'—'} kcal`
      : `B: ${x.macro&&x.macro.bartek?Math.round(x.macro.bartek.kcal):'—'} kcal · O: ${x.macro&&x.macro.oliwia?Math.round(x.macro.oliwia.kcal):'—'} kcal`;
    return `<div class="recipe mclick" onclick="${onclick}" style="cursor:pointer">
      <div class="recipe-h"><span class="recipe-id">${x.id}</span>${x.name} <span class="recipe-arrow">›</span></div>
      <div class="recipe-use">${catLabel(x.cat)} · ${macroHint}</div>
      ${x.prep?`<div class="recipe-txt" style="font-size:13px;color:var(--slate)">${x.prep.slice(0,90)}${x.prep.length>90?'…':''}</div>`:''}</div>`;
  }).join('');

  el.innerHTML=`<h2 class="section-h">Przepisy</h2>
    <div class="section-sub">Wszystkie dania z pełnym makro. Kliknij, by zobaczyć porcje, składniki i widoki (moja porcja / na 100 g / cały przepis).</div>
    <div class="filter-bar">${chips}</div>
    ${r||'<div class="empty">Brak w tej kategorii.</div>'}`;
}
function setRecipeFilter(f){recipeFilter=f;renderPrzepisy();}

// ---- BATCH ----
function renderBatch(){
  const el=document.getElementById('batch');
  const b=MOD.blocks.map(x=>{
    const mo=blockMacro(x,'oliwia'),mb=blockMacro(x,'bartek'),ms=blockMacro(x,'syn');
    const actual=(state.cookedWeight&&state.cookedWeight[x.id]);
    return `<div class="batch-card">
    <div class="batch-h mclick" onclick="openBlock('${x.id}')">${x.name} <span class="recipe-arrow">›</span></div>
    <div class="batch-weight">Gotowa partia ~<b>${actual||x.batchWeight} g</b>${actual?' (zważona)':''} na ${x.portions} porcji:</div>
    <div class="batch-portions">
      <span class="dot d-oliwia"></span> Oliwia ${mo?Math.round(mo.portionG||0):'?'} g &nbsp;·&nbsp;
      <span class="dot d-bartek"></span> Bartek ${mb?Math.round(mb.portionG||0):'?'} g &nbsp;·&nbsp;
      <span class="dot d-syn"></span> Teoś ${ms?Math.round(ms.portionG||0):'?'} g
    </div>
    <div class="recipe-sec">Składniki całej partii</div><div class="recipe-txt">${x.ingrAll}</div>
    <div class="recipe-sec">Przyprawy</div><div class="recipe-txt">${x.spice||'—'}</div></div>`;}).join('');
  el.innerHTML=`<h2 class="section-h">Bloki obiadowe (batch)</h2>
    <div class="section-sub">Siedem dużych gotowań, każde na 2 dni. Kliknij blok, by wpisać rzeczywistą masę garnka — makro porcji się przeliczy.</div>${b}`;
}

// ---- ZAKUPY ----
function renderZakupy(){
  const el=document.getElementById('zakupy');
  const week=viewWeek();
  if(!nav.shopDays||!Array.isArray(nav.shopDays))nav.shopDays=[0,1,2,3,4,5,6];
  const sel=nav.shopDays;
  const selectedDays=sel.map(i=>week.days[i]).filter(Boolean);
  const totals=shoppingFromDays(selectedDays);

  const byCat={};
  Object.entries(totals).forEach(([name,v])=>{
    const cat=shopCatOf(name);(byCat[cat]=byCat[cat]||[]).push([name,v]);
  });
  const catOrder=['Mięso i ryby','Nabiał i jajka','Pieczywo, zboża','Warzywa i owoce','Pozostałe'];
  let html='';
  catOrder.forEach(cat=>{
    if(!byCat[cat])return;
    html+=`<div class="shop-cat">${cat}</div>`;
    byCat[cat].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([name,v])=>{
      const id='p_'+week.id+'_'+name;const done=state.shopChecked[id];
      const q = v.qty>=1000 ? (v.qty/1000).toFixed(v.qty%1000?1:0)+' kg' : Math.round(v.qty)+' g';
      html+=`<div class="shop-item ${done?'done':''}">
        <input type="checkbox" ${done?'checked':''} onchange="toggleShop('${id.replace(/'/g,"\\'")}')">
        <span class="shop-name">${name}</span><span class="shop-q">${q}</span></div>`;
    });
  });

  const weekOpts=state.weeks.slice().reverse().map(w=>{
    const label=w.id===state.curWeekId?`Tydzień ${w.id} (bieżący)`:`Tydzień ${w.id}`;
    return `<option value="${w.id}" ${w.id===week.id?'selected':''}>${label}</option>`;
  }).join('');
  const dayChecks=DAY_SHORT.map((nm,i)=>`<button class="shopday-btn ${sel.includes(i)?'active':''}" onclick="toggleShopDay(${i})">${nm}</button>`).join('');

  el.innerHTML=`<h2 class="section-h">Lista zakupów</h2>
    <div class="section-sub">Liczona z receptur wylosowanych dań wybranego tygodnia, dla całej rodziny. Obiady liczone jako pół partii na dzień.</div>
    <div class="card" style="margin-bottom:14px">
      <select class="week-select" style="margin-bottom:10px;width:100%" onchange="viewWeekSelect(this.value)">${weekOpts}</select>
      <div style="font-size:13px;color:var(--slate);margin-bottom:6px">Które dni kupujemy:</div>
      <div class="shopday-picker">${dayChecks}</div>
      <div class="range-quick" style="margin-top:8px">
        <button class="btn ghost sm" onclick="setShopDays([0,1,2,3,4,5,6])">Cały tydzień</button>
        <button class="btn ghost sm" onclick="setShopDays([0,1,2,3,4])">Pon–Pt</button>
        <button class="btn ghost sm" onclick="setShopDays([5,6])">Weekend</button>
      </div>
    </div>
    <div class="card">${html||'<div class="empty">Zaznacz dni powyżej.</div>'}</div>`;
}
function setShopWeek(w){nav.shopWeek=w;saveNav();renderZakupy();}
function toggleShopDay(i){
  if(!nav.shopDays)nav.shopDays=[0,1,2,3,4,5,6];
  const idx=nav.shopDays.indexOf(i);
  if(idx>=0)nav.shopDays.splice(idx,1);else nav.shopDays.push(i);
  saveNav();renderZakupy();
}
function setShopDays(arr){nav.shopDays=arr.slice();saveNav();renderZakupy();}
function toggleShop(id){
  if(state.shopChecked[id])delete state.shopChecked[id];
  else state.shopChecked[id]=true;
  save();renderZakupy();
}

// ---- PROFILE ----
function renderProfile(){
  const el=document.getElementById('profile');
  const cards=PEOPLE.map(p=>{
    const t=state.targets[p.id];
    const row=(k,label,unit)=> (t[k]!=null&&t[k]!==0)||k==='kcal' ?
      `<div class="macro-row"><label>${label}</label><div><input type="number" value="${t[k]||''}" onchange="setTarget('${p.id}','${k}',this.value)"><span class="unit">${unit}</span></div></div>`:'';
    return `<div class="card profile-card p-${p.color}">
      <div class="profile-name"><span class="dot d-${p.color}"></span>${p.name}</div>
      <div class="profile-goal">${p.goal}</div>
      ${row('kcal','Kalorie','kcal')}
      ${row('protein','Białko','g')}
      ${row('carbs','Węgle','g')}
      ${row('fat','Tłuszcz','g')}
      ${row('fiber','Błonnik','g')}</div>`;
  }).join('');
  el.innerHTML=`<h2 class="section-h">Profile i cele</h2>
    <div class="section-sub">Cele dzienne z pliku (edytowalne). Teoś ma tylko kalorie i błonnik — porcje dziecka są orientacyjne i zależne od apetytu.</div>
    <div class="grid g3">${cards}</div>
    <div class="note">Plan to praktyczny punkt startowy dla zdrowych osób. Przy chorobach, zaburzeniach cyklu, nieprawidłowym wzrastaniu dziecka lub problemach z jedzeniem — konsultacja z lekarzem lub dietetykiem. Oceniajcie średnią masę ciała z 2–3 tygodni. Wartości produktów są średnie — dla marek warto sprawdzić etykietę (zwłaszcza whey, pieczywo, nabiał).</div>
    <div class="btn-row">
      <button class="btn ghost" onclick="exportData()">Eksport danych (JSON)</button>
      <button class="btn ghost" onclick="document.getElementById('imp').click()">Import danych</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)"></div>
    <div class="note" style="background:#eef0f4;border-color:var(--slate)">
      <b>Kolejne paczki dań:</b> nowy plik od ChatGPT w tym samym formacie (Produkty, Składniki receptur, Porcje i makro, Profile) — wyślij mi go, dołączę nowe dania z pełnym makro.</div>`;
}
function setTarget(p,k,v){state.targets[p][k]=+v||0;save();renderDzis();}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dieta_backup.json';a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Wczytano dane');}catch(err){toast('Błędny plik');}};
  r.readAsText(f);
}

// ============ NAV ============
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function switchTab(view){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===view));
  nav.activeTab=view;saveNav();
}
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>switchTab(tab.dataset.view);
});

// ============ LOGOWANIE ============
function checkPin(){
  const v=document.getElementById('pinInput').value.trim();
  if(v===APP_PIN){
    nav.unlocked=true;saveNav();
    document.getElementById('lockPin').style.display='none';
    document.getElementById('lockPerson').style.display='block';
  }else{
    document.getElementById('pinErr').textContent='Błędny PIN';
    document.getElementById('pinInput').value='';
  }
}
function pickPerson(p){
  nav.person=p;saveNav();
  document.getElementById('lockScreen').style.display='none';
  updateWhoBadge();
}
function switchPerson(){
  // szybkie przełączenie osoby (bez PIN, bo już w środku)
  nav.person = nav.person==='oliwia'?'bartek':'oliwia';
  saveNav();updateWhoBadge();toast('Widok: '+(nav.person==='oliwia'?'Oliwia':'Bartek'));
}
function updateWhoBadge(){
  const b=document.getElementById('whoBadge');if(!b)return;
  if(nav.person){
    const name=nav.person==='oliwia'?'Oliwia':'Bartek';
    b.innerHTML=`<span class="dot d-${nav.person}"></span>${name}`;
    b.style.display='';
  }else b.style.display='none';
}
function showLock(){
  const ls=document.getElementById('lockScreen');
  if(nav.unlocked && nav.person){ls.style.display='none';updateWhoBadge();return;}
  ls.style.display='flex';
  if(nav.unlocked){document.getElementById('lockPin').style.display='none';document.getElementById('lockPerson').style.display='block';}
}

// ============ INIT ============
function boot(){
  try{
    render();
    if(nav.activeTab&&nav.activeTab!=='dzis')switchTab(nav.activeTab);  // przywroc ostatnia zakladke
    showLock();  // pokaz ekran logowania jesli nie odblokowane
    initCloud();
  }catch(err){
    document.querySelector('.wrap').innerHTML=`<div class="card" style="max-width:520px;margin:40px auto;text-align:center">
      <h2 class="section-h">Coś się zacięło</h2>
      <p style="color:var(--slate);margin:12px 0 20px">Zwykle to stare dane w przeglądarce. Kliknij, aby wyczyścić i uruchomić od nowa.</p>
      <button class="btn" onclick="localStorage.removeItem('${KEY}');localStorage.removeItem('${NAV_KEY}');location.reload()">Wyczyść i uruchom ponownie</button>
      <p style="color:var(--slate);font-size:11px;margin-top:16px">${(err&&err.message)||err}</p></div>`;
    console.error(err);
  }
}
boot();


</script>
</body>
</html>
